<head>

<style>
:root{--bg:#eceef0;--card:#fafafb;--tx:#23272c;--mu:#6c737c;--ln:#dcdfe3;--pr:#3d4650;--prt:#fff;--hd:#3d4650;--dg:#b4524f;--ac:#f0f1f3;--in:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1e2226;--tx:#e4e7ea;--mu:#8b929a;--ln:#2d3237;--pr:#c9cfd6;--prt:#1a1d20;--hd:#252a2f;--dg:#e07f7b;--ac:#272c31;--in:#16181b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
svg{flex:none;vertical-align:middle}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:11px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;font-size:15px;font-family:inherit}
.ib:active{background:rgba(255,255,255,.22)}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:13px;color:var(--mu)}.v{font-size:19px;font-weight:700;margin-top:2px;direction:ltr;text-align:right}
.big .v{font-size:22px}
h3{font-size:15px;color:var(--mu);margin:18px 4px 8px;font-weight:600}
.party{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:17px}
.party small{display:block;color:var(--mu);font-size:13px;margin-top:3px}.party b{direction:ltr}
.row{display:flex;justify-content:space-between;gap:8px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:9px 4px 8px;font-size:12.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button.on{color:var(--pr);font-weight:700}
.fab{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--pr);color:var(--prt);border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:7;display:flex;align-items:center;gap:7px;font-family:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--pr);color:var(--prt);margin-top:10px;font-family:inherit}
.btn.s{background:var(--ac);color:var(--tx);border:1px solid var(--ln)}.btn.d{background:transparent;color:var(--dg)}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 5px}
input,select{width:100%;font-size:17px;padding:13px;border-radius:11px;border:1px solid var(--ln);background:var(--in);color:var(--tx);font-family:inherit}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
.sheet h2{margin:0 0 4px;font-size:19px}
.pimg{width:100%;border:1px solid var(--ln);border-radius:8px;margin-top:10px;background:#fff}
.empty{text-align:center;color:var(--mu);padding:30px 10px;line-height:1.9}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.strip div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}.strip span{display:block;font-size:12px;color:var(--mu)}.strip b{font-size:18px;direction:ltr;display:block;text-align:right}
.xl{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--ln);border-radius:12px;max-height:calc(100vh - 340px);min-height:260px}
.xl table{border-collapse:separate;border-spacing:0;width:100%}
.xl th,.xl td{border-bottom:1px solid var(--ln);border-left:1px solid var(--ln);padding:0;font-size:15px;white-space:nowrap}
.xl th{background:var(--ac);color:var(--mu);font-weight:600;padding:10px 8px;position:sticky;top:0;z-index:2}
.xl td input{width:100%;border:0;border-radius:0;background:transparent;padding:12px 8px;font-size:16px}
.xl td input:focus{outline:2px solid var(--pr);outline-offset:-2px;background:var(--ac)}
.xl td.ro{padding:12px 8px;background:var(--ac);direction:ltr;text-align:right}
.xl .c0{position:sticky;right:0;background:var(--ac);color:var(--mu);text-align:center;min-width:42px;z-index:1}
.xl th.c0{z-index:3}
.xl tfoot td{background:var(--ac);font-weight:700;padding:12px 8px;position:sticky;bottom:0;direction:ltr;text-align:right}
.xl .sm td,.xl .sm th{padding:12px 8px;text-align:right}
.x{background:none;border:0;color:var(--dg);padding:10px}
.tabs{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mt{white-space:nowrap;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:7px 13px;font-size:15px;display:flex;align-items:center;gap:5px;font-family:inherit}
.mt.on{background:#fff;color:#2c333a;font-weight:700;border-color:#fff}
#kb{position:fixed;left:0;right:0;bottom:0;will-change:top;transform:translateZ(0);z-index:30;display:flex;gap:8px;padding:8px 10px;background:var(--card);border-top:1px solid var(--ln)}#kb[hidden]{display:none}
#kb button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:600;border:0;border-radius:10px;padding:12px;background:var(--pr);color:var(--prt);font-family:inherit}#kb .kbd{flex:0 0 100px;background:var(--ac);color:var(--tx)}
.lg{width:38px;height:38px;border-radius:10px;background:#fff;padding:2px;flex:none}
.plist{display:block}
@media (min-width:768px){
 header{padding-left:max(18px,calc((100vw - 1040px)/2));padding-right:max(18px,calc((100vw - 1040px)/2))}
 header h1{font-size:21px}
 main{max-width:1040px;padding:20px}
 .plist{display:grid;grid-template-columns:1fr 1fr;gap:14px}.plist .card{margin-bottom:0}
 .strip{grid-template-columns:repeat(4,1fr)}.strip b{font-size:21px}
 .xl{max-height:calc(100vh - 290px)}.xl th,.xl td{font-size:16px}.xl td input{font-size:17px;padding:14px 10px}
 .v{font-size:22px}.big .v{font-size:26px}
 .sheet-bg{align-items:center;justify-content:center}.sheet{border-radius:20px;max-width:540px;max-height:88%;padding-bottom:18px}
 .fab{left:max(24px,calc((100vw - 1040px)/2));padding:15px 22px;font-size:17px}
 nav{justify-content:center}nav button{max-width:200px;font-size:14px}
 #kb{padding:10px max(14px,calc((100vw - 1040px)/2))}

@media (min-width:768px) and (orientation:landscape){main{max-width:1100px}.plist{grid-template-columns:1fr 1fr 1fr}}

 const [y,mo]=e.m.split('-');if(/^s\d+$/.test(e.id)&&e.date===e.m+'-'+String(new Date(+y,+mo,0).getDate()).padStart(2,'0'))e.date=''});

const cards=t=>`<div class="card"><div class="grid"><div><div class="k">الكمية</div><div class="v">${fmt(t.q)}</div></div><div><div class="k">عدد السندات</div><div class="v">${t.n}</div></div><div><div class="k">بدون الضريبة</div><div class="v">${fmt(t.ex)}</div></div><div><div class="k">الضريبة 15%</div><div class="v">${fmt(t.vat)}</div></div></div><div class="big" style="margin-top:12px;border-top:1px solid var(--ln);padding-top:10px"><div class="k">الإجمالي مع الضريبة</div><div class="v">${fmt(t.tot)}</div></div></div>`;
function render(){
 const hd=document.getElementById('hd'),app=document.getElementById('app'),fab=document.getElementById('fabw');
 document.getElementById('nav').innerHTML=[['sup','الموردين','truck'],['cus','العملاء','users'],['tot','المجموع','chart']].map(([k,l,i])=>`<button class="${tab===k&&!pid?'on':''}" onclick="go('${k}')">${ic(i,23)}${l}</button>`).join('');
 fab.innerHTML='';
 if(pid){
  const p=S.parties.find(x=>x.id===pid);if(!p){pid=null;return render()}
  const all=ents(pid);let months=[...new Set(all.map(e=>e.m))];
  if(!curM)curM=months.length?[...months].sort().pop():nowM();
  if(curM!=='all'&&!months.includes(curM))months.push(curM);
  months.sort();
  hd.innerHTML=`<button class="ib" onclick="pid=null;render()">${ic('chevR',22)}</button><h1>${esc(p.name)}</h1><button class="ib" onclick="stmt()">${ic('image')}<span>كشف</span></button><button class="ib" onclick="editParty('${p.id}')">${ic('pencil',18)}</button>
   <div class="tabs">${months.map(m=>`<button class="mt ${m===curM?'on':''}" onclick="curM='${m}';render()">${mshort(m)}</button>`).join('')}<button class="mt ${curM==='all'?'on':''}" onclick="curM='all';render()">الإجمالي</button><button class="mt" onclick="addMonth()">${ic('plus',16)}شهر</button></div>`;
  if(curM==='all'){
   const tt=sum(all);
   app.innerHTML=`<div class="xl"><table class="sm"><thead><tr><th>الشهر</th><th>الكمية</th><th>الإجمالي</th><th>الضريبة</th><th>مع الضريبة</th></tr></thead><tbody>`
    +months.map(m=>{const t=sum(all.filter(e=>e.m===m));return`<tr onclick="curM='${m}';render()"><td>${mshort(m)} · ${monthName(m).split(' ')[0]}</td><td>${fmt(t.q)}</td><td>${fmt(t.ex)}</td><td>${fmt(t.vat)}</td><td><b>${fmt(t.tot)}</b></td></tr>`}).join('')
    +`</tbody><tfoot><tr><td>المجموع</td><td>${fmt(tt.q)}</td><td>${fmt(tt.ex)}</td><td>${fmt(tt.vat)}</td><td>${fmt(tt.tot)}</td></tr></tfoot></table></div>`;
  }else{
   const list=all.filter(e=>e.m===curM);
   app.innerHTML=`<div class="strip"><div><span>الكمية</span><b id="s_q"></b></div><div><span>الإجمالي بدون الضريبة</span><b id="s_ex"></b></div><div><span>الضريبة 15%</span><b id="s_vat"></b></div><div><span>الإجمالي مع الضريبة</span><b id="s_tot"></b></div></div>
   <div class="xl"><table><thead><tr><th class="c0">#</th><th style="min-width:150px">التاريخ</th><th style="min-width:95px">رقم السند</th><th style="min-width:110px">الصنف</th><th style="min-width:90px">الكمية</th><th style="min-width:80px">السعر</th><th style="min-width:105px">الإجمالي</th><th style="min-width:95px">ضريبة 15%</th><th style="min-width:115px">مع الضريبة</th><th></th></tr></thead><tbody>`
   +list.map((e,i)=>rh(e,i)).join('')
   +`</tbody><tfoot><tr><td colspan="4">المجموع</td><td id="f_q"></td><td></td><td id="f_ex"></td><td id="f_vat"></td><td id="f_tot"></td><td></td></tr></tfoot></table></div>`;
   updSum();
   fab.innerHTML=`<button class="fab" onclick="addRow()">${ic('plus')}صف</button>`;
  }
 }else if(tab==='tot'){
  hd.innerHTML=`<img class="lg" src="${LOGO.src}"><h1>المجموع</h1>`;
  const a=sum(byType('supplier')),b=sum(byType('customer')),all={q:a.q+b.q,ex:a.ex+b.ex,vat:a.vat+b.vat,tot:a.tot+b.tot,n:a.n+b.n};
  app.innerHTML=`<h3>الموردين</h3>${cards(a)}<h3>العملاء</h3>${cards(b)}<h3>مجموع الاثنين</h3>${cards(all)}
  <div class="card"><div class="k">الفرق (العملاء − الموردين) مع الضريبة</div><div class="v" style="color:${b.tot-a.tot<0?'var(--dg)':'var(--tx)'}">${fmt(b.tot-a.tot)}</div></div>
  <h3>نسخة احتياطية</h3><div class="card"><div class="k">البيانات محفوظة داخل هذا الجهاز فقط. احفظ نسخة بين فترة وأخرى.</div>
  <button class="btn s" onclick="backup()">${ic('dl')}حفظ نسخة احتياطية</button><button class="btn s" onclick="document.getElementById('imp').click()">${ic('ul')}استرجاع نسخة</button>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="restore(this)"></div>`;
 }else{
  const t=tab==='sup'?'supplier':'customer',w=tab==='sup'?'مورد':'عميل';
  hd.innerHTML=`<img class="lg" src="${LOGO.src}"><h1>${tab==='sup'?'كشوفات الموردين':'كشوفات العملاء'}</h1><button class="ib" onclick="editParty()">${ic('plus',18)}<span>${w}</span></button>`;
  const ps=S.parties.filter(p=>p.type===t);
  app.innerHTML=cards(sum(byType(t)))+(ps.length?'<div class="plist">'+ps.map(p=>{const s=sum(ents(p.id));return`<div class="card party" onclick="pid='${p.id}';curM=null;render();scrollTo(0,0)"><div>${esc(p.name)}<small>${s.n} سند · كمية ${fmt(s.q)}</small></div><b>${fmt(s.tot)}</b></div>`}).join('')+'</div>':`<div class="empty">لا يوجد ${tab==='sup'?'موردين':'عملاء'} بعد.<br>اضغط «${w}» في الأعلى للإضافة</div>`);
 }
}
const rowOf=id=>S.entries.find(e=>e.id===id);
function ed(id,k,v){const e=rowOf(id);v=v.trim();if(k==='dn')v=v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));e[k]=v;if(k==='t')lastType=v;save()}
function edn(id,k,v){const e=rowOf(id),n=toNum(v);e[k]=isNaN(n)?0:n;if(k==='price')lastPrice=e.price;save();const c=calc(e),g=i=>document.getElementById(i+'_'+id);
 g('a').textContent=fmt(c.ex);g('b').textContent=fmt(c.vat);g('c').textContent=fmt(c.tot);updSum()}
function updSum(){const t=sum(ents(pid).filter(e=>e.m===curM)),set=(i,v)=>{const x=document.getElementById(i);if(x)x.textContent=fmt(v)};
 set('s_q',t.q);set('s_ex',t.ex);set('s_vat',t.vat);set('s_tot',t.tot);set('f_q',t.q);set('f_ex',t.ex);set('f_vat',t.vat);set('f_tot',t.tot)}
const rh=(e,i)=>{const c=calc(e);return`<tr id="r_${e.id}"><td class="c0">${i+1}</td>
<td><input type="date" value="${e.date||''}" onchange="ed('${e.id}','date',this.value)"></td>
<td><input inputmode="numeric" data-c="dn" value="${esc(e.dn)}" onchange="ed('${e.id}','dn',this.value)"></td>
<td><input value="${esc(e.t)}" onchange="ed('${e.id}','t',this.value)"></td>
<td><input inputmode="decimal" data-c="qty" value="${e.qty||''}" oninput="edn('${e.id}','qty',this.value)"></td>
<td><input inputmode="decimal" data-c="price" value="${e.price}" oninput="edn('${e.id}','price',this.value)"></td>
<td class="ro" id="a_${e.id}">${fmt(c.ex)}</td><td class="ro" id="b_${e.id}">${fmt(c.vat)}</td><td class="ro" id="c_${e.id}">${fmt(c.tot)}</td>
<td><button class="x" onclick="delRow('${e.id}')">${ic('trash',18)}</button></td></tr>`};
function focusCell(tr,col){const inp=tr.querySelector('input[data-c="'+col+'"]');if(!inp)return;inp.focus();try{inp.select()}catch(x){}tr.scrollIntoView({block:'center'})}
function nextCell(){const a=document.activeElement;if(!a||!a.dataset||!a.dataset.c)return;const c=a.dataset.c,tr=a.closest('tr'),nx=tr.nextElementSibling;
 if(nx)focusCell(nx,c);else if(a.value.trim()!=='')addRow(c);else a.blur()}
function addRow(col){col=typeof col==='string'?col:'dn';const e={id:uid(),pid,m:curM,dn:'',date:'',t:lastType,qty:0,price:lastPrice};S.entries.push(e);save();
 const tb=document.querySelector('.xl tbody');
 if(tb){tb.insertAdjacentHTML('beforeend',rh(e,tb.rows.length));updSum();focusCell(document.getElementById('r_'+e.id),col)}else render()}
const kbEl=()=>document.getElementById('kb');
kbEl().innerHTML=`<button class="kbd" onpointerdown="event.preventDefault();document.activeElement.blur()">${ic('check',18)}تم</button><button onpointerdown="event.preventDefault();nextCell()">التالي${ic('down',18)}</button>`;
let kbT;function kbPos(){const v=globalThis.visualViewport,k=kbEl();if(k.hidden)return;if(!v){k.style.top='auto';k.style.bottom='0';return}k.style.bottom='auto';k.style.top=(v.offsetTop+v.height-k.offsetHeight)+'px'}
function kbTrack(){clearInterval(kbT);let n=0;kbPos();kbT=setInterval(()=>{kbPos();if(++n>30)clearInterval(kbT)},50)}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.c){kbEl().hidden=false;kbTrack()}});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.c))kbEl().hidden=true},80));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.c){e.preventDefault();nextCell()}});
if(globalThis.visualViewport)['resize','scroll'].forEach(ev=>visualViewport.addEventListener(ev,kbPos));
addEventListener('scroll',kbPos,{passive:true});
function delRow(id){if(!confirm('حذف هذا الصف؟'))return;S.entries=S.entries.filter(e=>e.id!==id);save();render()}
function addMonth(){sheet(`<h2>إضافة شهر</h2><label>الشهر</label><input id="nm" type="month" value="${nowM()}"><button class="btn" onclick="if(nm.value){curM=nm.value;close_();render()}">إضافة</button><button class="btn s" onclick="close_()">إلغاء</button>`)}
function go(k){tab=k;pid=null;render();scrollTo(0,0)}
function close_(){document.getElementById('modal').innerHTML=''}
function sheet(h){document.getElementById('modal').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)close_()"><div class="sheet">${h}</div></div>`}
function editParty(id){
 const p=id?S.parties.find(x=>x.id===id):null;
 sheet(`<h2>${p?'تعديل الاسم':'إضافة '+(tab==='sup'?'مورد':'عميل')}</h2><label>الاسم</label><input id="pn" value="${esc(p?.name)}">
 <button class="btn" onclick="saveParty('${id||''}')">حفظ</button>${p?`<button class="btn d" onclick="delParty('${id}')">${ic('trash',18)}حذف مع كل سنداته</button>`:''}<button class="btn s" onclick="close_()">إلغاء</button>`);
}
function saveParty(id){
 const n=document.getElementById('pn').value.trim();if(!n)return alert('اكتب الاسم');
 if(id)S.parties.find(x=>x.id===id).name=n;else S.parties.push({id:uid(),name:n,type:tab==='sup'?'supplier':'customer'});
 save();close_();render();
}
function delParty(id){if(!confirm('حذف الاسم وجميع سنداته؟'))return;S.parties=S.parties.filter(p=>p.id!==id);S.entries=S.entries.filter(e=>e.pid!==id);save();close_();pid=null;render()}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='asas-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.parties||!d.entries)throw 0;if(!confirm('سيتم استبدال البيانات الحالية. متابعة؟'))return;S=d;S.v=S.v||2;save();render()}catch(e){alert('ملف غير صالح')}};r.readAsText(f)}
/* ===== كشف الكميات كصورة ===== */
function drawDoc(o){
 const W=1240,M=50,RH=50,PER=30,F='"SF Arabic","Geeza Pro",-apple-system,Arial,sans-serif',np=Math.max(1,Math.ceil(o.rows.length/PER));
 return Array.from({length:np},(_,pi)=>{
  const rows=o.rows.slice(pi*PER,(pi+1)*PER),last=pi===np-1,H=354+rows.length*RH+(last?230:40)+80;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.direction='rtl';
  const T=(t,px,py,f,col,al)=>{x.font=f+' '+F;x.fillStyle=col;x.textAlign=al||'center';x.fillText(String(t),px,py)};
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#3d4650';x.fillRect(0,0,W,150);
  if(LOGO.complete&&LOGO.naturalWidth){x.fillStyle='#fff';x.fillRect(M,22,106,106);x.drawImage(LOGO,M+3,25,100,100)}
  T('أسس التوريد للتجارة',W-M,72,'700 44px','#fff','right');T(o.title,W-M,122,'400 28px','#d5d9de','right');
  T(o.who+': '+o.name,W-M,208,'700 30px','#23272c','right');T('الفترة: '+o.period,M,208,'600 28px','#23272c','left');
  T('تاريخ الإصدار: \u202A'+new Date().toISOString().slice(0,10)+'\u202C',W-M,256,'400 24px','#6c737c','right');T('عدد السندات: '+o.t.n,M,256,'400 24px','#6c737c','left');
  let y=300;x.fillStyle='#e6e8eb';x.fillRect(M,y,W-2*M,54);
  const line=yy=>{x.fillStyle='#dcdfe3';x.fillRect(M,yy,W-2*M,1)};
  let xr=W-M;o.cols.forEach(cl=>{T(cl.h,xr-cl.w/2,y+36,'700 23px','#23272c');xr-=cl.w});
  y+=54;
  rows.forEach((r,ri)=>{if(ri%2){x.fillStyle='#f6f7f8';x.fillRect(M,y,W-2*M,RH)}
   let xr=W-M;r.forEach((v,ci)=>{T(v,xr-o.cols[ci].w/2,y+34,'400 24px','#23272c');xr-=o.cols[ci].w});line(y+RH);y+=RH});
  if(last){y+=30;const bw=(W-2*M-60)/4,L=[['الكمية',o.t.q],['الإجمالي بدون الضريبة',o.t.ex],['الضريبة 15%',o.t.vat],['الإجمالي مع الضريبة',o.t.tot]];
   L.forEach(([l,v],i)=>{const bx=W-M-bw-i*(bw+20),dk=i===3;x.fillStyle=dk?'#3d4650':'#f1f2f4';x.fillRect(bx,y,bw,130);
    T(l,bx+bw/2,y+42,'400 22px',dk?'#d5d9de':'#6c737c');T(fmt(v),bx+bw/2,y+95,'700 32px',dk?'#fff':'#23272c')})}
  T('صفحة '+(pi+1)+' من '+np,W/2,H-34,'400 22px','#8b929a');
  return c})
}
function stmt(){const ms=[...new Set(ents(pid).map(e=>e.m))].sort();
 sheet(`<h2>كشف كميات</h2><div class="k">يُنشأ كصور جاهزة للمشاركة</div><label>الفترة</label><select id="sm">${ms.map(m=>`<option value="${m}" ${m===curM?'selected':''}>${monthName(m)}</option>`).join('')}<option value="all" ${curM==='all'?'selected':''}>ملخص كل الأشهر</option></select>
 <button class="btn" onclick="genStmt()">${ic('image')}إنشاء الصور</button><button class="btn s" onclick="close_()">إلغاء</button>`)}
async function genStmt(){
 const v=document.getElementById('sm').value,p=S.parties.find(x=>x.id===pid),all=ents(pid).filter(e=>e.qty>0),
 b={who:p.type==='supplier'?'المورد':'العميل',name:p.name,title:'كشف كميات'};let o;
 if(v==='all'){const ms=[...new Set(all.map(e=>e.m))].sort();
  o={...b,period:'ملخص كل الأشهر',cols:[['الشهر',300],['الكمية',200],['بدون الضريبة',220],['الضريبة 15%',200],['مع الضريبة',220]].map(([h,w])=>({h,w})),
   rows:ms.map(m=>{const t=sum(all.filter(e=>e.m===m));return[mshort(m)+'  '+monthName(m).split(' ')[0],fmt(t.q),fmt(t.ex),fmt(t.vat),fmt(t.tot)]}),t:sum(all)}}
 else{const l=all.filter(e=>e.m===v);
  o={...b,period:monthName(v),cols:[['#',60],['التاريخ',160],['رقم السند',120],['الصنف',150],['الكمية',130],['السعر',100],['الإجمالي',150],['الضريبة',120],['مع الضريبة',150]].map(([h,w])=>({h,w})),
   rows:l.map((e,i)=>{const c=calc(e);return[i+1,e.date?'\u202A'+e.date+'\u202C':'—',e.dn||'—',e.t||'',fmt(e.qty),fmt(e.price),fmt(c.ex),fmt(c.vat),fmt(c.tot)]}),t:sum(l)}}
 if(!o.rows.length)return alert('لا توجد سندات في هذه الفترة');
 const bl=await Promise.all(drawDoc(o).map(c=>new Promise(r=>c.toBlob(r,'image/png'))));
 IMGS=bl.map((x,i)=>new File([x],`kashf-${v}-${i+1}.png`,{type:'image/png'}));
 sheet(`<h2>الكشف جاهز (${IMGS.length} ${IMGS.length>1?'صور':'صورة'})</h2><button class="btn" onclick="shareImgs()">${ic('share')}مشاركة</button><button class="btn s" onclick="saveImgs()">${ic('dl')}حفظ الصور</button><div class="k" style="margin-top:10px">أو اضغط مطولاً على الصورة لحفظها</div>${IMGS.map(f=>`<img class="pimg" src="${URL.createObjectURL(f)}">`).join('')}<button class="btn s" onclick="close_()">إغلاق</button>`)}
async function shareImgs(){try{if(navigator.canShare&&navigator.canShare({files:IMGS}))await navigator.share({files:IMGS,title:'كشف كميات'});else saveImgs()}catch(e){}}
function saveImgs(){IMGS.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()},i*400))}
render();
</script>
</body>
